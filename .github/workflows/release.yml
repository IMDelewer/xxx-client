name: Release

on:
  push:
    tags: ['v*', '[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (leave empty to use XXX_VERSION)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  android:
    uses: ./.github/workflows/android-apk.yml
    with:
      release: true

  sign-android:
    needs: android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: xxx-android-unsigned
          path: unsigned
      - name: Install Android signing tools
        run: |
          if [[ ! -x "$ANDROID_HOME/build-tools/36.1.0/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.1.0"
          fi
      - name: Sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 is required}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is required}"
          umask 077
          signing_dir="$(mktemp -d "$RUNNER_TEMP/xxx-sign.XXXXXX")"
          trap 'rm -f "$signing_dir/key.p12" "$signing_dir/aligned.apk"; rmdir "$signing_dir"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/key.p12"
          unset ANDROID_KEYSTORE_BASE64
          tools="$ANDROID_HOME/build-tools/36.1.0"
          "$tools/zipalign" -P 16 -f 4 unsigned/Xxx.apk "$signing_dir/aligned.apk"
          "$tools/apksigner" sign --ks "$signing_dir/key.p12" --ks-key-alias xxx-release \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --out xxx-android-arm64.apk "$signing_dir/aligned.apk"
          "$tools/apksigner" verify xxx-android-arm64.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xxx-client-Android
          path: xxx-android-arm64.apk
          if-no-files-found: error

  publish:
    needs: [build, sign-android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: xxx-client-*
          merge-multiple: true
          path: release
      - name: Verify version and checksums
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import os
          from pathlib import Path
          import re
          version = re.search(r'#define XXX_VERSION "([^"]+)"', Path('src/game/version.h').read_text()).group(1)
          tag = os.environ.get('RELEASE_TAG') or version
          if tag not in (version, 'v' + version):
              raise SystemExit('Release tag must match XXX_VERSION')
          archives = sorted(p for p in Path('release').iterdir() if p.suffix in ('.zip', '.xz', '.dmg', '.apk'))
          groups = ('*-windows-*.zip', '*-darwin-*.dmg', '*-linux-*.tar.xz', 'xxx-android-arm64.apk')
          if len(archives) != len(groups) or any(len(list(Path('release').glob(pattern))) != 1 for pattern in groups):
              raise SystemExit('Expected one package for each desktop platform and Android')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tag=' + tag + '\n')
          Path('release/SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in archives))
          PYTHON
          python3 scripts/release_notes.py > release/NOTES.md
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: xxx client ${{ steps.version.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            release/*.zip
            release/*.dmg
            release/*.tar.xz
            release/xxx-android-arm64.apk
            release/SHA256SUMS
          body_path: release/NOTES.md
