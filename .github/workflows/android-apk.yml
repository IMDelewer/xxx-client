name: Android APK

on:
  pull_request:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      arch:
        description: Architecture
        type: choice
        default: arm64
        options:
          - arm64
          - arm
          - x86_64
          - all

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      APK_ARCH: ${{ inputs.arch || 'arm64' }}
      CARGO_HTTP_MULTIPLEXING: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c
      - name: Fetch Android libraries
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ddnet/ddnet-libs
          ref: c0e6703fbcdbe03df2f26875427ec3951ce4ec21
          path: ddnet-libs
          persist-credentials: false
      - name: Set up Android build tools
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          sdkmanager "ndk;29.0.14206865" "build-tools;36.1.0" "platforms;android-36"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y ninja-build
          cmake_archive=cmake-3.22.1-linux-x86_64.tar.gz
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/$cmake_archive" \
            "https://github.com/Kitware/CMake/releases/download/v3.22.1/$cmake_archive"
          (
            cd "$RUNNER_TEMP"
            echo "73565c72355c6652e9db149249af36bcab44d9d478c5546fd926e69ad6b43640  $cmake_archive" | sha256sum --check
            tar -xf "$cmake_archive"
          )
          echo "$RUNNER_TEMP/cmake-3.22.1-linux-x86_64/bin" >> "$GITHUB_PATH"
          rustup default 1.92.0
          cargo install cargo-ndk --locked --version 3.5.0
          rustup target add armv7-linux-androideabi i686-linux-android aarch64-linux-android x86_64-linux-android
      - name: Set up Vulkan SDK
        uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff
        with:
          version: 1.3.296.0
      - name: Build APK
        env:
          TW_UNSIGNED_RELEASE: '1'
        run: |
          python3 scripts/check_public_tree.py
          python3 -m unittest discover -s scripts -p test_packaging.py
          TW_VERSION_NAME="$(sed -n 's/^#define XXX_VERSION "\([0-9.]*\)"$/\1/p' src/game/version.h)"
          export TW_VERSION_NAME
          TW_VERSION_CODE="$(python3 - <<'PY'
          import os

          major, minor, patch = map(int, os.environ['TW_VERSION_NAME'].split('.'))
          code = major * 1_000_000 + minor * 1_000 + patch
          if not (0 < code <= 2_100_000_000 and 0 <= minor < 1_000 and 0 <= patch < 1_000):
              raise SystemExit('XXX_VERSION is outside the Android versionCode range')
          print(code)
          PY
          )"
          export TW_VERSION_CODE
          bash scripts/android/cmake_android.sh "$APK_ARCH" Xxx org.xxx.client Release build-android
          python3 scripts/check_public_tree.py --binary "$(find build-android/build_arch -name libXxx.so -print -quit)"
      - name: Sign test APK
        if: ${{ !inputs.release }}
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.p12" -storetype PKCS12 \
            -storepass android -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 30 -dname "CN=Xxx Test"
          tools="$ANDROID_HOME/build-tools/36.1.0"
          "$tools/zipalign" -P 16 -f 4 build-android/Xxx.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/test.p12" --ks-pass pass:android \
            --out "build-android/xxx-android-$APK_ARCH-test.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify "build-android/xxx-android-$APK_ARCH-test.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !inputs.release }}
        with:
          name: xxx-android-${{ inputs.arch || 'arm64' }}-test
          path: build-android/*-test.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.release
        with:
          name: xxx-android-unsigned
          path: build-android/Xxx.apk
          if-no-files-found: error
