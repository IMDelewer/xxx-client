name: Xxx-client APK (arm64)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      arch:
        description: "Architecture"
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - arm
          - x86_64
          - all

permissions:
  contents: write

concurrency:
  group: xxx-apk
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARGO_HTTP_MULTIPLEXING: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Fix line endings
        run: |
          if [ -d scripts ]; then
            find scripts -type f \( -name '*.sh' -o -name 'gradlew' -o -name '*.gradle' -o -name '*.properties' -o -name '*.pro' \) -exec sed -i 's/\r$//' {} + || true
            find scripts -type f \( -name '*.sh' -o -name 'gradlew' \) -exec chmod +x {} + || true
          fi
          if [ -f src/game/version.h ]; then sed -i 's/\r$//' src/game/version.h; fi

      - name: Rescue android scripts (если сурс урезан)
        run: |
          if [ ! -f scripts/android/cmake_android.sh ] || [ ! -f scripts/android/download_android_sdk.sh ] || [ ! -f scripts/compile_libs/_build_common.sh ]; then
            echo "scripts/android или scripts/compile_libs неполные — добираю из DDNet upstream"
            ok=0
            for i in 1 2 3; do
              curl -sL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 \
                https://github.com/ddnet/ddnet/archive/master.tar.gz -o /tmp/ddnet.tgz \
                && tar -xzf /tmp/ddnet.tgz -C /tmp && ok=1 && break
              sleep 5
            done
            if [ "$ok" != "1" ]; then echo "tarball DDNet не скачался"; exit 1; fi
            UP="$(find /tmp -maxdepth 1 -type d -name 'ddnet-master' | head -n1)"
            test -n "$UP" || { echo "в tarball нет ddnet-master"; exit 1; }
            mkdir -p scripts/android other/icons
            # Критично: download_android_sdk.sh и cmake_android.sh делают source
            # ../compile_libs/_build_common.sh — без него сборка падает на line 12.
            cp -R "$UP/scripts/android/." scripts/android/
            mkdir -p scripts/compile_libs
            cp -R "$UP/scripts/compile_libs/." scripts/compile_libs/
            cp "$UP/other/icons/DDNet_256x256x32.png" other/icons/DDNet_256x256x32.png
            find scripts -type f \( -name '*.sh' -o -name 'gradlew' \) -exec chmod +x {} +
          fi
          # Иконка нужна cmake_android.sh даже если scripts/android уже в репо
          if [ ! -f other/icons/DDNet_256x256x32.png ]; then
            echo "нет other/icons/DDNet_256x256x32.png — достаю из upstream"
            curl -sL --retry 3 -o other/icons/DDNet_256x256x32.png \
              https://raw.githubusercontent.com/ddnet/ddnet/master/other/icons/DDNet_256x256x32.png
            test -s other/icons/DDNet_256x256x32.png || { echo "иконка не скачалась"; exit 1; }
          fi
          test -f scripts/compile_libs/_build_common.sh || { echo "Нет scripts/compile_libs/_build_common.sh — source в download_android_sdk.sh упадёт"; exit 1; }
          test -x scripts/android/download_android_sdk.sh || chmod +x scripts/android/download_android_sdk.sh
          test -x scripts/android/cmake_android.sh || chmod +x scripts/android/cmake_android.sh

      - name: Add prebuilt Android libraries
        run: |
          DL_REF=c0e6703fbcdbe03df2f26875427ec3951ce4ec21
          clone_pinned() {
            rm -rf "$1"
            mkdir -p "$1"
            (
              cd "$1"
              git init -q
              git remote add origin https://github.com/ddnet/ddnet-libs
              git fetch -q --depth 1 origin "$DL_REF" && git checkout -q FETCH_HEAD
            )
          }
          if [ ! -d ddnet-libs ]; then
            echo "ddnet-libs в сурсе нет — клонирую целиком (закреплённый коммит ${DL_REF:0:8})"
            clone_pinned ddnet-libs || { echo "пинненный клон не удался, беру master"; git clone --depth 1 https://github.com/ddnet/ddnet-libs ddnet-libs; }
          fi
          clone_pinned /tmp/upstream-libs || git clone --depth 1 https://github.com/ddnet/ddnet-libs /tmp/upstream-libs
          find ddnet-libs -type d -name android -prune -exec rm -rf {} +
          rm -rf ddnet-libs/sdl/java
          (cd /tmp/upstream-libs && find . -type d \( -name android -o -path './sdl/java' \) -prune -print) | while read -r d; do
            mkdir -p "ddnet-libs/$d"
            cp -r "/tmp/upstream-libs/$d/." "ddnet-libs/$d/"
          done
          ls ddnet-libs/sdl ddnet-libs/curl
          test -f ddnet-libs/curl/android/libarm/libcurl.a || { echo "ERROR: prebuilt Android libraries were not copied"; exit 1; }

      - name: Cache Android SDK/NDK and CMake
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/Android/Sdk
            /home/runner/cmake
          key: android-sdk-r29-bt361-ct13114758-cmake-3.22.1

      - name: Prepare Linux
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build openjdk-21-jdk openssl
          if [ ! -x /home/runner/cmake/bin/cmake ]; then
            curl -LO https://github.com/Kitware/CMake/releases/download/v3.22.1/cmake-3.22.1-Linux-x86_64.tar.gz
            mkdir -p /home/runner/cmake
            tar --strip-components 1 -C /home/runner/cmake -xf cmake-3.22.1-Linux-x86_64.tar.gz
          fi
          scripts/android/download_android_sdk.sh /home/runner
          rustup default 1.92.0
          cargo install cargo-ndk --locked --version 3.5.0
          rustup target add armv7-linux-androideabi i686-linux-android aarch64-linux-android x86_64-linux-android

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.3.296.0
          cache: true

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-8.13-agp-8.13.0-android

      - name: Build APK
        env:
          TW_KEY_NAME: /home/runner/App.jks
          TW_KEY_ALIAS: "Xxx-Key"
        run: |
          printf '%s' "" | base64 -d > /home/runner/App.jks
          export TW_KEY_PW="XxxSign2026"
          export TW_VERSION_CODE="$(grep '#define DDNET_VERSION_NUMBER' src/game/version.h | awk '{print $3}' | tr -d '\r' | head -n1)"
          if [ -z "${TW_VERSION_CODE}" ]; then export TW_VERSION_CODE=1; fi
          export TW_VERSION_NAME="$(grep '#define GAME_RELEASE_VERSION_INTERNAL' src/game/version.h | awk '{print $3}' | tr -d '\r' | head -n1)"
          if [ -z "${TW_VERSION_NAME}" ]; then export TW_VERSION_NAME="0.2.1"; fi
          echo "version: $TW_VERSION_NAME ($TW_VERSION_CODE)"
          export ANDROID_HOME="/home/runner/Android/Sdk"
          unset ANDROID_SDK_ROOT
          export PATH=/home/runner/cmake/bin:$PATH
          scripts/android/cmake_android.sh "${{ inputs.arch || 'arm64' }}" "Xxx" "org.xxx.client" Release build-xxx
          mkdir artifacts
          mv build-xxx/Xxx.apk artifacts/ || find build-xxx -name '*.apk' -exec cp {} artifacts/ \;
          ls -l artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xxx-android-${{ inputs.arch || 'arm64' }}
          path: artifacts

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "xxx-v${{ github.run_number }}" artifacts/*.apk \
            --title "Xxx-client ${{ github.run_number }} (xxx-client-0.2.1)" \
            --notes "Автосборка APK Xxx-client из сурса xxx-client-0.2.1 (пакет org.xxx.client, ABI по выбору, по умолчанию arm64). Подпись постоянная — новые сборки ставятся поверх старых Xxx-client. Первая установка поверх сборок с другим ключом: сначала удалить старую версию." \
            --latest || gh release upload "xxx-v${{ github.run_number }}" artifacts/*.apk --clobber
